# Development: `docker compose up -d postgres` and run the backend and the
# frontend from their folders. Full application: `docker compose up -d --build`.
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Only reachable from this machine
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrateur}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      STORAGE_DIR: /data/storage
      ANALYSIS_INPUT_PRICE: ${ANALYSIS_INPUT_PRICE:-0}
      ANALYSIS_OUTPUT_PRICE: ${ANALYSIS_OUTPUT_PRICE:-0}
    volumes:
      - storage-data:/data/storage

  # Daily backup of the database and of the uploaded files into BACKUP_DIR,
  # which should be a folder copied off the server (network share, synced
  # folder). See scripts/backup.sh and scripts/restore.sh.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: Europe/Paris
      PGHOST: postgres
      PGDATABASE: ${POSTGRES_DB}
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_TIME: ${BACKUP_TIME:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - storage-data:/data/storage
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts:/scripts:ro
    entrypoint: ["sh", "/scripts/backup.sh", "--daily"]

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  postgres-data:
  storage-data:
