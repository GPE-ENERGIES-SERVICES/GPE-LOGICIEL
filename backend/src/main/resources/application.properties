spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:tenders}
spring.datasource.username=${POSTGRES_USER:tenders}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

spring.http.clients.connect-timeout=10s
spring.http.clients.read-timeout=30s

boamp.base-url=https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp
# TED search API (Publications Office of the EU), open without account
ted.base-url=https://api.ted.europa.eu
# Days fetched from a source never collected successfully
collect.initial-days=7
# Sources not collected. TED stays aside until its notices are matched with
# the BOAMP consultations of the same procedure.
collect.disabled-sources=TED

# Two collections per working day, Paris time
collect.cron=0 0 7,13 * * MON-FRI

# Closes tenders whose deadline has passed, every hour
tenders.close-cron=0 5 * * * *

server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# First administrator, created at startup when no account exists
bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Administrateur}

# Uploaded consultation files (DCE)
documents.storage-dir=${STORAGE_DIR:./storage}
documents.office-command=${OFFICE_COMMAND:soffice}
documents.conversion-timeout=2m
documents.max-archive-entries=2000
documents.max-extracted-size=2GB
documents.max-archive-depth=3
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# AI analysis of the consultation files. Documents beyond the size limit are
# listed as not analysed. Prices (euros per million tokens) give the cost of
# each analysis.
analysis.max-characters=400000
analysis.input-price-per-million=${ANALYSIS_INPUT_PRICE:0}
analysis.output-price-per-million=${ANALYSIS_OUTPUT_PRICE:0}
