spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:tenders}
spring.datasource.username=${POSTGRES_USER:tenders}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

spring.http.clients.connect-timeout=10s
spring.http.clients.read-timeout=30s
# The collectors (BOAMP, TED...) keep the HTTP client of the JDK, even with
# Apache HttpClient on the classpath (used only by SafeHttpFetcher).
spring.http.clients.imperative.factory=jdk

boamp.base-url=https://boamp-datadila.opendatasoft.com/api/explore/v2.1/catalog/datasets/boamp
# TED search API (Publications Office of the EU), open without account
ted.base-url=https://api.ted.europa.eu
# APProch purchase projects (open data of the ministry of economy) and the
# company search API of the State giving the names of their buyers, both open
# without account. Projects are forecasts, not notices: APPROCH stays disabled
# until it is chosen to collect them (collect.disabled-sources=).
approch.base-url=https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/projets-dachats-publics
approch.companies-url=https://recherche-entreprises.api.gouv.fr
# marches-publics.info (AW Solutions), read from its public search below the
# limits of its terms of use (100 notices per hour, 500 per day). Its terms do
# not forbid such a reading; AW Solutions confirmed it in writing. AWS stays
# disabled until its conditions are checked: see docs/technique.md (AWS).
aw-solutions.base-url=https://www.marches-publics.info
# Works only; 40 s before each page read (at most 90 pages per hour by itself);
# reading stops at 90 pages in the last hour or 450 in the last 24 hours.
aw-solutions.natures=T
aw-solutions.pause=40s
aw-solutions.max-pages-per-hour=90
aw-solutions.max-pages-per-day=450
collect.disabled-sources=APPROCH,AWS
# Days fetched from a source never collected successfully
collect.initial-days=7

# Catch-up of the scheduled collections missed while the application was
# stopped: checked 2 minutes after the start, then every hour. A collection
# resuming on its own asks 14 publication days at most; a catch-up makes 5
# collections at most per source, 1 minute apart. A source without successful
# collection for more than 24 working hours (Monday to Friday) is shown late.
collect.catch-up.enabled=true
collect.catch-up.delay=2m
collect.catch-up.cron=0 30 * * * *
collect.catch-up.max-days-per-run=14
collect.catch-up.max-runs=5
collect.catch-up.pause=1m
collect.catch-up.alert-working-hours=24

# Two collections per working day, Paris time
collect.cron=0 0 7,13 * * MON-FRI

# Closes tenders whose deadline has passed, every hour
tenders.close-cron=0 5 * * * *

server.servlet.session.timeout=8h
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# First administrator, created at startup when no account exists
bootstrap-admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
bootstrap-admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
bootstrap-admin.name=${BOOTSTRAP_ADMIN_NAME:Administrateur}

# Eligibility of the consultation files: a tender is eligible when it is open
# and matches at least one active saved search. Out-of-date eligibilities are
# evaluated after each collection, each change of a saved search and every 10
# minutes, by batches of 200 tenders. No platform is contacted.
dce.eligibility.batch-size=200
dce.eligibility.sweep-interval=10m
dce.eligibility.auto-evaluation=true

# Automated retrieval of the consultation files of the eligible tenders.
# Only the platforms listed here, after their written agreement, are ever
# contacted: none by default. The worker is disabled by default too.
# quota: space of all the retrieved files, in bytes (3 GB = 3,000,000,000).
dce.retrieval.allowed-platforms=
dce.retrieval.worker-enabled=false
dce.retrieval.concurrency=2
dce.retrieval.poll-interval=30s
dce.retrieval.max-attempts=5
dce.retrieval.retry-delay=10m
dce.retrieval.max-retry-delay=6h
dce.retrieval.lease=30m
dce.retrieval.max-file-size=500MB
dce.retrieval.quota=3000000000B
dce.retrieval.connect-timeout=10s
dce.retrieval.read-timeout=60s
dce.retrieval.max-redirects=5

# Uploaded consultation files (DCE)
documents.storage-dir=${STORAGE_DIR:./storage}
documents.office-command=${OFFICE_COMMAND:soffice}
documents.conversion-timeout=2m
documents.max-archive-entries=2000
documents.max-extracted-size=2GB
documents.max-archive-depth=3
# Documents of a dossier, and scanned pages of a document, read at the same
# time: 0 takes as many as the processors, up to 4.
documents.read-threads=${DOCUMENTS_READ_THREADS:0}
# Pages without text read by optical character recognition (Tesseract, on the
# server, nothing sent outside); plans are never read. Without Tesseract the
# scanned pages stay unread, as before.
documents.ocr.command=${OCR_COMMAND:tesseract}
documents.ocr.language=fra
documents.ocr.max-pages=40
# Images of the consultation files (JPG, PNG, TIFF, BMP, GIF, HEIC) that may be
# pieces of the consultation are turned into a PDF and read by OCR; photos,
# plans and illustrations are kept aside. HEIC photos are decoded by libheif.
documents.images.heif-command=${HEIF_COMMAND:heif-dec}
documents.images.max-file-size=100MB
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB

# AI analysis of the consultation files: OFF by default. Nothing is sent to
# any provider and nothing is spent until analysis.enabled, analysis.provider
# and analysis.external-transmission-allowed are all set AND the provider has
# its key (environment only, never here): see docs/technique.md (Analyse par
# IA). One provider is part of the application: anthropic (Claude).
analysis.enabled=${ANALYSIS_ENABLED:false}
analysis.provider=${ANALYSIS_PROVIDER:none}
analysis.external-transmission-allowed=${ANALYSIS_EXTERNAL_TRANSMISSION:false}
# Claude (analysis.provider=anthropic): model, depth of thinking (low to max)
# and longest output of one call, thinking included. Key: ANALYSIS_API_KEY.
analysis.anthropic.model=${ANALYSIS_ANTHROPIC_MODEL:claude-opus-5-5}
analysis.anthropic.effort=${ANALYSIS_ANTHROPIC_EFFORT:high}
analysis.anthropic.max-tokens=32000
# Limits of one analysis: text sent, which makes the cost (documents beyond are
# listed as not analysed, never cut), documents (chosen and ordered by the rules
# of DocumentTriage: no plan, no duplicate, most useful first), length of the
# answer, wait for it.
# An analysis started by itself once a dossier is read waits this long before
# being sent, so that a user may still cancel it.
analysis.auto-start-delay=2m
analysis.max-characters=400000
analysis.max-documents-per-tender=30
analysis.max-output-tokens=8000
analysis.request-timeout=5m
# Queue: calls at the same time, attempts on temporary errors (2 min, then
# doubled, at most 1 h, with jitter), release of an analysis left in progress.
analysis.max-concurrent-requests=1
analysis.max-attempts=3
analysis.retry-delay=2m
analysis.max-retry-delay=1h
analysis.lease=15m
analysis.poll-interval=30s
# Ceiling in euros of the analyses of a calendar month, estimated from the
# tokens and the prices below (empty = none). Not the invoice of the
# provider: set a ceiling there too. Prices (euros per million tokens) give
# the cost of each analysis.
analysis.monthly-budget=${ANALYSIS_MONTHLY_BUDGET:}
analysis.input-price-per-million=${ANALYSIS_INPUT_PRICE:0}
analysis.output-price-per-million=${ANALYSIS_OUTPUT_PRICE:0}
