# Overrides for tests only: no scheduled job runs and nothing is written
# outside the build directory.
collect.cron=-
tenders.close-cron=-
collect.catch-up.enabled=false
collect.catch-up.cron=-
collect.catch-up.pause=0s
dce.eligibility.sweep-interval=1h
dce.eligibility.auto-evaluation=false
dce.retrieval.poll-interval=1h
documents.storage-dir=target/test-storage
documents.office-command=missing-office-binary

# No test calls the real TED API: the tests of TED give their own client.
collect.disabled-sources=TED,APPROCH,AWS
ted.base-url=http://ted.test
approch.base-url=http://approch.test
approch.companies-url=http://companies.test
aw-solutions.base-url=http://aws.test
aw-solutions.pause=0s
collect.retry-delay=0s

# No look at the AI queue during tests: the tests wake the worker themselves.
analysis.poll-interval=1h
